# Render Blueprint for ChessVerse — Render's native Node runtime.
# (Native Node is reliable here, and Render supports WebSockets for realtime.)
#
# Render → New → Blueprint → select this repo. It creates the service from here.
# Then set INSFORGE_BASE_URL to your real project URL (see below).
#
# NOTE on the install command: Render sets NODE_ENV=production, which makes plain
# `npm install` SKIP devDependencies (e.g. vite). We use `--include=dev` so the
# client build toolchain actually installs, then build, then install server deps.
services:
  - type: web
    name: chessverse
    runtime: node
    plan: free
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      # Render auto-provides PORT so we do NOT set it here.
      - key: HOST
        value: 0.0.0.0
      - key: DB_MODE
        value: insforge
      # Placeholder — set this to your real value in the dashboard (repo is public).
      - key: INSFORGE_BASE_URL
        value: https://your-project.region.insforge.app
      # Secret — fill in the Render dashboard.
      - key: INSFORGE_API_KEY
        sync: false
      # Auto-generated secure signing secret.
      - key: SESSION_SECRET
        generateValue: true
